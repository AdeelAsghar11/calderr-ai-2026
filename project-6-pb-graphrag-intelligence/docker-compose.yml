version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: project-6-pb-graphrag-intelligence/Dockerfile
    container_name: graphrag_intelligence_api
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - graphrag_data:/app/project-6-pb-graphrag-intelligence

  dashboard:
    build:
      context: ..
      dockerfile: project-6-pb-graphrag-intelligence/Dockerfile
    container_name: graphrag_intelligence_dashboard
    command: uv run streamlit run project-6-pb-graphrag-intelligence/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - graphrag_data:/app/project-6-pb-graphrag-intelligence
    depends_on:
      - api

volumes:
  graphrag_data:
